[project]
name = "chotubot"
version = "0.1.0"
description = "Personal local-first AI chat app with tool-using agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-nvidia-ai-endpoints",
    # Phase 2 document RAG (owner-approved 2026-11-18; versions verified on Windows + Python 3.13)
    "fastembed>=0.9.1,<0.10",
    "faiss-cpu>=1.16.0,<2",
    "pypdf>=7.1.0,<8",
    "python-multipart>=0.0.34",
    "numpy>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q"
